<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>#GIRLBOSSES WILL NOT FREE US</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f5f0e8;
      --black: #1a1a1a;
      --red: #c0392b;
    }

    body {
      background: var(--cream);
      color: var(--black);
      font-family: 'Source Serif 4', Georgia, serif;
      font-weight: 300;
      line-height: 1.75;
    }

    header {
      background: var(--black);
      color: var(--cream);
      padding: 3rem 2rem 2.5rem;
      text-align: center;
      border-bottom: 4px solid var(--red);
    }

    header .label {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 1rem;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      line-height: 1.1;
    }

    header h1 span { color: var(--red); }

    header .subtitle {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #bbb;
      letter-spacing: 0.05em;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    .audio-section {
      background: var(--black);
      color: var(--cream);
      border-radius: 4px;
      padding: 2rem;
      margin-bottom: 3rem;
    }

    .audio-section p {
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 1rem;
    }

    .audio-section audio {
      width: 100%;
      accent-color: var(--red);
    }

    .pdf-wrapper {
      width: 90vw;
      margin-left: calc(-45vw + 50%);
      padding: 0 2rem 4rem;
    }

    .pdf-wrapper iframe {
      width: 100%;
      height: 1200px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

<header>
  <div class="label">Maria Roberts - Podcast Final</div>
  <h1>#GIRLBOSSES WILL<br><span>NOT FREE US</span></h1>
  <div class="subtitle">Why White Feminism Needs to Be Abolished &amp; What Should Replace It</div>
</header>

<main>
  <div class="audio-section">
    <p>&#9654; Episode 1: Who Gets to Survive? Black Maternal Mortality and Feminism</p>
    <audio controls>
      <source src="podcast-audio.mp3" type="audio/mpeg" />
    </audio>
  </div>

  <div class="pdf-wrapper">
    <iframe src="script.pdf"></iframe>
  </div>
</main>

</body>
</html>
